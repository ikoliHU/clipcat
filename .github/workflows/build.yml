name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: src-tauri/target/release/bundle/nsis/*-setup.exe
          - os: ubuntu-22.04
            bundles: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y file libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # A rögzítőmotor (OBS portable zip kivonata) verziója a bundle-obs.ps1-ben van
      - name: Cache capture engine
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: src-tauri/obs
          key: obs-${{ hashFiles('bundle-obs.ps1') }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # A CI-build aláíratlan (PR-en nincs secret); a frissítőcsomagokat a release.yml készíti
      - name: Build
        shell: bash
        run: npx --yes @tauri-apps/cli@2 build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        with:
          name: clipcat-${{ runner.os }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
