name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: src-tauri/target/release/bundle/nsis/*-setup.exe
          - os: ubuntu-22.04
            bundles: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # A rögzítőmotor (OBS portable zip kivonata) verziója a bundle-obs.ps1-ben van
      - name: Cache capture engine
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: src-tauri/obs
          key: obs-${{ hashFiles('bundle-obs.ps1') }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Build
        run: npx --yes @tauri-apps/cli@2 build

      - uses: actions/upload-artifact@v4
        with:
          name: clipcat-${{ runner.os }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

      - name: Release (draft)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.bundles }}
